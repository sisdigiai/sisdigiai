# Configuração versionada das edge functions do projeto digiai (hswyopqvnolqpmprqvzh).
# Nasceu em 08/09/2026: o portão da função `espelho-pulso` dependia do flag verify_jwt do
# gateway, que vivia só no painel — e a casa já viu redeploy religar o gateway sem o flag.
# Regra: toda função que exige sessão declara verify_jwt = true AQUI; as que recebem webhook
# de terceiro (assinatura própria) declaram false explicitamente, nunca por omissão.
# Deploy pela Management API não lê este arquivo — o metadata do deploy repete o flag; a CLI lê.
project_id = "hswyopqvnolqpmprqvzh"

[functions.espelho-pulso]
verify_jwt = true

# Rota para o Limelight: a autorização é o segredo próprio
# (CONTENT_RULES_LIMELIGHT_SECRET, comparado por SHA-256 em tempo constante),
# não uma sessão. `false` DECLARADO, nunca por omissão — se ficasse true, o
# Limelight precisaria de um JWT do nosso projeto, que é exatamente o
# acoplamento que esta rota existe para desfazer.
[functions.espelho-content-rules]
verify_jwt = false

# Rota para o GJ puxar a ordem do dia: autorização é o segredo próprio
# (ROADMAP_GJ_SECRET), não sessão. `false` DECLARADO — se ficasse true, o cron do
# GJ precisaria de um JWT do nosso projeto, que é o acoplamento que a rota desfaz.
# Substitui a push-ordem-gj, que sai depois do pull provado (portão 54).
[functions.roadmap-gj]
verify_jwt = false

# Chamadas SEM sessão por desenho — medido na Management API em 16/09/2026 (todas verify_jwt=false em
# produção e, até aqui, sem bloco: um deploy pela CLI sem flag as teria virado para true e derrubado a
# landing, os webhooks e o health). Declaradas para o repo dizer o que a produção faz.
#
# Landings chamam sem chave (keyless first-party); a trava é a allowlist de códigos e de origem.
[functions.events-ingest]
verify_jwt = false

# Formulário das landings (sem chave); a trava é validação de payload + service_role só no servidor.
[functions.lead-capture]
verify_jwt = false

# Materiais públicos de afiliado (leitura keyless).
[functions.affiliate-materials-public]
verify_jwt = false

# Webhooks de terceiros: a autorização é a assinatura/token próprio de cada um (hottok, Kiwify, Mercado Pago).
[functions.hotmart-webhook]
verify_jwt = false

[functions.kiwify-webhook]
verify_jwt = false

[functions.mercadopago-webhook]
verify_jwt = false

# Sonda de disponibilidade.
[functions.health]
verify_jwt = false

name: CI

# Valida tipos + build a cada push/PR na main, pra deploy do Netlify nunca subir quebrado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint   # tsc --noEmit
      - run: npm run build
